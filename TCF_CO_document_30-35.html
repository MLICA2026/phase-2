<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF-CO Banque d'entraînement par catégorie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;padding:1rem}
#app{max-width:860px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.header img{height:52px;object-fit:contain}
.header-right{text-align:right}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:12px;color:#888;margin-top:2px}
.prog-bar{height:5px;background:#e0ddd5;border-radius:3px;margin-bottom:4px}
.prog-fill{height:100%;background:#185FA5;border-radius:3px;transition:width .35s}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:1rem}
.nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.85rem}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #d0cdc5;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#444}
.btn:hover{background:#f5f4f0}
.btn-results{margin-left:auto;border-color:#185FA5;color:#185FA5;font-weight:600;background:#fff}
.btn-results:hover{background:#e6f1fb}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.q-type-label{display:inline-block;background:#E6F1FB;color:#0C447C;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.75rem;font-weight:500}
.src-label{display:inline-block;background:#f0f0f0;color:#666;border-radius:6px;padding:2px 8px;font-size:11px;margin-left:6px}
.img-wrap{text-align:center;margin-bottom:1rem}
.img-wrap img{max-width:100%;max-height:280px;border-radius:8px;border:1px solid #e0ddd5}
.audio-row{display:flex;align-items:center;gap:10px;background:#f0f6fe;border:1px solid #B5D4F4;border-radius:8px;padding:.65rem 1rem;margin-bottom:1rem}
.play-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid #185FA5;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:background .15s}
.play-btn:hover{background:#e6f1fb}
.audio-label{flex:1;font-size:13px;color:#185FA5;font-weight:500}
.question{font-size:16px;font-weight:600;margin-bottom:.9rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{padding:11px 15px;border:1px solid #d0cdc5;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;background:#fff;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,border-color .15s}
.choice:hover:not(.correct):not(.wrong):not(.disabled){background:#f5f4f0}
.choice.disabled{cursor:default}
.choice .badge{font-weight:700;min-width:22px;flex-shrink:0;color:#185FA5;font-size:15px}
.choice.correct{border-color:#0F6E56;background:#E1F5EE;color:#085041}
.choice.correct .badge{color:#085041}
.choice.wrong{border-color:#993C1D;background:#FAECE7;color:#4A1B0C}
.choice.wrong .badge{color:#4A1B0C}
.feedback{border-radius:8px;padding:10px 14px;margin-top:.85rem;font-size:14px}
.feedback.ok{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
.feedback.ko{background:#FAECE7;color:#4A1B0C;border:1px solid #F0997B}
.transcript-box{background:#f0f6fe;border:1px solid #B5D4F4;border-radius:0 0 8px 8px;padding:.9rem 1.1rem;font-size:13.5px;line-height:1.85;color:#1a1a1a;font-style:italic}
.transcript-box mark{background:#FAC775;color:#412402;border-radius:3px;padding:1px 3px;font-style:normal}
.key-label{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;border-radius:6px;padding:3px 10px;font-size:12px;margin-bottom:.5rem}
.summary{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.5rem}
.summary h2{font-size:20px;font-weight:700;margin-bottom:1.25rem;text-align:center}
.score-block{text-align:center;margin-bottom:1.5rem}
.score-correct{font-size:32px;font-weight:700;color:#185FA5}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:1.25rem 0}
.grid-btn{width:36px;height:36px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;color:#fff}
.grid-btn.ok{background:#1D9E75}
.grid-btn.ko{background:#993C1D}
.grid-btn.na{background:#bbb}
.sum-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem}
.sum-btn{padding:8px 18px;border-radius:8px;border:1px solid #B5D4F4;background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:#185FA5}
.sum-btn:hover{background:#e6f1fb}
.sum-btn.red{border-color:#F0997B;color:#993C1D}
.sum-btn.red:hover{background:#FAECE7}
.sum-btn.pdf{border-color:#639922;color:#3B6D11;background:#EAF3DE}
.sum-btn.pdf:hover{background:#c0dd97}
.sum-note{font-size:11px;color:#aaa;margin-top:.75rem}
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.report-item{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1.1rem;margin-bottom:.85rem}
.qnum{font-size:13px;font-weight:700;color:#185FA5;margin-bottom:.6rem}
.report-choice{padding:8px 12px;border-radius:7px;font-size:13px;margin-bottom:5px}
.report-choice.neutral{background:#f5f4f0}
.report-choice.correct{background:#E1F5EE;color:#085041;font-weight:600}
.report-choice.wrong{background:#FAECE7;color:#4A1B0C}
/* level select screen */
.level-select{display:flex;flex-direction:column;gap:10px}
.level-card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;padding:1rem 1.25rem;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .15s,background .15s}
.level-card:hover{border-color:#185FA5;background:#f0f6fe}
.level-name{font-size:20px;font-weight:700;color:#185FA5;min-width:48px}
.level-desc{flex:1;font-size:13px;color:#555;padding:0 10px}
.level-count{font-size:12px;color:#888;white-space:nowrap}
@media print {
  body{background:#fff;padding:0}
  #app{max-width:100%}
  .nav,.sum-actions,.prog-bar,.prog-labels{display:none!important}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid;margin-bottom:.5rem;padding:.75rem}
  .summary{border:none}
  .grid-btn{width:28px;height:28px;font-size:10px}
  .print-section{display:block!important}
  .no-print{display:none!important}
}
.print-section{display:none}
</style>
</head>

<script type="application/json" id="qdata">{"doc_30_35": [{"type": "document", "q": "Question 30. Comment se prend l'étudiant pour réviser l'anglais ?", "c": ["Il parle toujours anglais avec ses amis anglais.", "Il bavarde régulièrement avec son voisin anglais.", "Il va souvent au café avec un groupe d'amis anglais.", "Il fait beaucoup d'exercices avec un ami anglais."], "a": 1, "k": "Le garçon qui a la chambre à côté de la mienne est anglais", "transcript": "– Dis, comment tu fais pour réviser ton anglais, toi ? Surtout l'oral. J'ai beau apprendre des centaines de mots, faire des exercices, je n'avance pas.\n– Moi, j'ai un truc. Pour l'oral, pas de livres, pas de cassettes. Le garçon qui a la chambre à côté de la mienne est anglais, alors on s'invite pour le café deux soirs par semaine et on parle moitié en anglais, moitié en français.\n– Ah mais c'est bien ça ! Et je pourrais venir aussi.\n– D'accord, mais tu viens avec une copine. À quatre, c'est plus amusant.", "audio": "CO 3/030.MP3", "_test": "3", "_pos": 30, "_origlabel": "test3#30", "_sources": ["test3#30"]}, {"type": "document", "q": "Question 32. Qu'est-ce qui pousse les jeunes à travailler dans les métiers des métaux ?", "c": ["Les salaires attractifs.", "L'aspect magique de la métamorphose de la matière.", "La sécurité de l'emploi.", "La simplicité des techniques."], "a": 1, "k": "L'aspect magique de la métamorphose de la matière.", "transcript": "Je sais que vous allez fréquemment à la rencontre des jeunes au sein de l'association qui tente de promouvoir les métiers des métaux. Est-ce que ce sont des métiers qui font rêver aujourd'hui les jeunes ?\n– Il y a une dimension mystique autour de ces artisanats du fer. La transformation de la barre de métal au feu a toujours fasciné le profane. L'alchimie qui permet de voir la transformation d'un lingot de métal en une œuvre finie a toujours émerveillé. Et donc on attire assez facilement les jeunes vers ces savoir-faire, notamment en ce qui concerne la ferronnerie d'art. Il y a une dimension artistique de créativité en plus.", "audio": "CO 34/032.MP3", "_test": "4", "_pos": 32, "_origlabel": "test4#32", "_sources": ["test4#32"]}, {"type": "document", "q": "Question 33. Quelle est la particularité de l'établissement de Philippe ?", "c": ["C'est la reproduction d'un café du siècle dernier.", "Il contient un dépôt-vente de meubles design.", "C'est à la fois un restaurant et une galerie d'art.", "Il y organise un festival de musique électronique."], "a": 2, "k": "j'ai accroché des tableaux, des œuvres contemporaines", "transcript": "– Alors, Philippe, est-ce que vous pouvez nous apprendre plus sur votre établissement ?\n– Quand j'ai récupéré l'endroit, il s'agissait d'un lieu qui était ancien à Montréal au début du 19e siècle. J'ai donc gardé ce qui était d'époque et j'ai rajouté une touche moderne, design, pour créer un espace particulier où des styles se mélangent. Comme je suis un passionné des meubles design, j'ai acheté des pièces qui me plaisent, et en plus d'y manger, on peut assister à des soirées musicales. Il y a un DJ très connu internationalement dans le domaine de la musique électronique. Enfin, étant donné qu'on est dans un lieu très haut plafond, j'ai accroché des tableaux, des œuvres contemporaines, mais on organise ici des expos temporaires. Toutes les formes de l'expression nous intéressent.", "audio": "CO 5/033.MP3", "_test": "5", "_pos": 33, "_origlabel": "test5#33", "_sources": ["test5#33", "test40#32"]}, {"type": "document", "q": "Question 35. Qu'explique la personne interviewée ?", "c": ["Établir des priorités s'avère être très difficile.", "Grâce au numérique les gains de temps sont importants.", "Il n'y a pas de limite à la quantité d'informations traitées.", "La communication en ligne est addictive."], "a": 0, "k": "on perd un petit peu le sens de la priorité", "transcript": "Si vous voulez vraiment voir quelles sont vos priorités dans une journée, ce qui est vraiment important se compte sur les doigts d'une main. Le problème, c'est que le flux d'informations aujourd'hui est tel qu'on est submergé d'informations parmi lesquelles on perd un petit peu le sens de la priorité.", "audio": "CO 6/035.MP3", "_test": "6", "_pos": 35, "_origlabel": "test6#35", "_sources": ["test6#35", "test37#34"]}, {"type": "document", "q": "Question 34. Quel conseil est donné aux parents pour faciliter le retour en France de leurs enfants ?", "c": ["De choisir une école avec un petit nombre de classes.", "De permettre aux jeunes de parler de leur chagrin.", "De placer les enfants dans une école internationale.", "D'expliquer le système scolaire français aux enfants."], "a": 1, "k": "de laisser l'enfant exprimer son mal-être", "transcript": "Le retour en France peut ne pas être évident pour les enfants d'expatriés. Le succès passe souvent par l'accueil de l'école, comme en témoigne Marie Leblanc dont les enfants ont intégré une petite école de quartier. Chaque maîtresse avait préparé les enfants à la venue des nouveaux en disant qu'ils avaient vécu à l'étranger. Les enfants étaient valorisés, avaient plein de choses à raconter. Mais l'adaptation présente parfois des difficultés, comme ce fut le cas pour les enfants de Françoise Casalis. Eux, ils ont eu beaucoup de mal à s'adapter au système scolaire français, assez rigide. Un des conseils que l'on peut donner aux parents, c'est de laisser l'enfant exprimer son mal-être. Il faut que l'enfant puisse faire son deuil.", "audio": "CO 8/034.MP3", "_test": "8", "_pos": 34, "_origlabel": "test8#34", "_sources": ["test8#34"]}, {"type": "document", "q": "À quel type d'entreprise appartient ce service ?", "c": ["Un groupe de centres d'appels téléphoniques", "Un service de livraison express du courrier", "Un spécialiste de création de sites internet", "Un fournisseur pour la restauration à domicile"], "a": 1, "k": "Nous acheminons chaque jour plus de 75 millions de plis.", "transcript": "Coli.com, toujours à votre service. Nous acheminons chaque jour plus de 75 millions de plis. Si, malgré tous nos efforts, un envoi n'est pas parvenu à son destinataire, des professionnels sont à votre disposition pour réaliser les recherches nécessaires et s'engagent à vous tenir informés dans les plus brefs délais. Pour ce faire, connectez-vous à notre site www.coli.com ou appelez le 08 67 35 35 35. Nous serons toujours à votre écoute.", "audio": "CO 10/030.MP3", "_test": "10", "_pos": 30, "_origlabel": "test10#30", "_sources": ["test10#30", "test14#30"]}, {"type": "document", "q": "Qu'est-ce qui a décidé Daniel Desmoulins à démarrer son activité ?", "c": ["La qualité croissante des résultats.", "Les aménagements hydrauliques.", "L'expérience de ses collègues.", "L'importation de pieds de vigne."], "a": 0, "k": "les produits devenaient de mieux en mieux", "transcript": "Depuis quelques années, des vignerons ont investi des sommes importantes au Québec pour se lancer dans une nouvelle culture, comme Daniel Desmoulins, qui a ouvert le vignoble « L'Ange Gardien » en face du fleuve Saint-Laurent.\n– Faire du vin au Québec, c'est un challenge. Je ne me serais peut-être pas lancé dans cette aventure il y a 20 ans, mais je trouvais que les produits devenaient de mieux en mieux. C'est pour cela qu'il y a 10 ans, avec ma femme, nous avons décidé de nous lancer dans le vin. Je pense que nous avons des produits extrêmement intéressants parce qu'ils ont un petit peu d'acidité. Et puis, il y a toujours le vin de glace. Nous avons la température adéquate pour cela. Nous récoltons le raisin fin décembre, début janvier.", "audio": "CO 24/034.MP3", "_test": "24", "_pos": 34, "_origlabel": "test24#34", "_sources": ["test24#34", "test35#34"]}, {"type": "document", "q": "Pourquoi ce site plaît-il aux propriétaires de voitures ?", "c": ["il contrôle rigoureusement toutes les formalités de garantie", "il organise préalablement une rencontre avec les locataires", "il propose une première révision gratuite des véhicules", "il vérifie systématiquement l'identité de chacun de ses clients"], "a": 0, "transcript": "Zilok Auto se présente comme le numéro 1 du secteur. Marion Carrette : 'On a un contrat, on a un système d'assurance qui permet d'assurer vraiment le locataire pour la voiture pendant la durée de la location. On a un système d'évaluation, un système de caution, et tout ça fait que le propriétaire arrive sur notre site en étant rassuré.'", "k": "système d'assurance", "audio": "CO 30/030.MP3", "_test": "30", "_pos": 30, "_origlabel": "test30#30", "_sources": ["test30#30"]}, {"type": "document", "q": "Qu'est-ce qui ressort de l'interview concernant l'utilisation des jeux vidéo pour les élèves en décrochage ?", "c": ["C'est la solution actuellement la plus adaptée à ce problème scolaire.", "Elle permet de faire évoluer le regard des jeunes sur l'école.", "Il faut éviter de mélanger aspects éducatif et ludique à l'école.", "Les nouvelles technologies à l'école sont mal perçues par les familles."], "a": 1, "k": "inscrire l'école dans l'univers de jeunes", "transcript": "— Les jeux vidéo, ce sera le thème aujourd'hui, sont souvent, on le sait, la hantise des parents qui se plaignent qu'ils éloignent leurs enfants de la vie réelle, entre guillemets, et notamment de la scolarité. Or, une expérience qui vise à utiliser ces jeux pour ramener à l'école les décrocheurs scolaires vient de commencer à Bordeaux. Pensez-vous, Claude, que les jeux vidéo puissent être un outil efficace pour réconcilier des décrocheurs scolaires avec la scolarité ?\n— Le choix des jeux vidéo est une idée intéressante parce qu'elle permet d'inscrire l'école dans l'univers de jeunes qui ont souvent l'impression qu'elle se situe sur une planète à laquelle ils n'ont pas accès. Mais en matière de décrochage scolaire, il n'y a pas de gadget miracle, et un outil n'est efficace que s'il s'inscrit dans le cadre d'une prise en charge qui prend en compte les causes profondes du décrochage de chaque élève.", "audio": "CO 31/034.MP3", "_test": "31", "_pos": 34, "_origlabel": "test31#34", "_sources": ["test31#34"]}, {"type": "document", "q": "Question 34. De quoi parle cet artiste ?", "c": ["De la particularité de sa voix.", "De la reprise d'une oeuvre.", "De sa nouvelle tournée.", "De son dernier rôle au cinéma."], "a": 1, "k": "j'ai chanté cette chanson-là", "transcript": "C'est une des plus grandes chansons qui aient été faites dans toute l'histoire de la chanson francophone. C'est un court métrage, c'est même un long métrage en quelques minutes. Et arriver à dépeindre tout un univers où on comprend la complexité du personnage, où on peut tout mettre dans un contexte social, où on a même presque des parfums... on a tout dans cette chanson-là. Donc oui, pour moi, c'est comme si j'avais chanté une grammaire. Si j'étais un classique, j'aurais joué Bach. J'ai chanté à Saint-Paul, j'ai chanté cette chanson-là.", "audio": "CO 19/034.MP3", "_test": "19", "_pos": 34, "_origlabel": "test19#34", "_sources": ["test19#34", "test33#32"]}, {"type": "document", "q": "Question 31. De quoi dépend le montant du pourboire au Québec ?", "c": ["De la législation en vigueur.", "De la paye des employés.", "Du bon vouloir du client.", "Du type d'établissement."], "a": 2, "k": "laisser une somme d'argent à quelqu'un pour le remercier de ses bons services", "transcript": "– Bonjour. Alors, voilà ma question. Je voudrais savoir comment fonctionne le système des pourboires au Québec, car cela varie beaucoup d'un pays à l'autre. Est-ce obligatoire ou non ?\n– Eh bien, c'est une chose courante chez nous de laisser une somme d'argent à quelqu'un pour le remercier de ses bons services, car le service n'est pas inclus dans le salaire du personnel.\n– Et comment calcule-t-on la somme d'argent qu'on doit laisser ?\n– En général, on doit laisser entre 15 et 20 % de la somme indiquée sur la facture. C'est une vraie gymnastique au moment de payer ?\n– Non, pas vraiment. Nous autres Québécois, on est habitués à ce système. Ça se fait presque automatiquement.\nDe quoi dépend le montant du pourboire au Québec ?", "audio": "CO 36/031.MP3", "_test": "36", "_pos": 31, "_origlabel": "test36#31", "_sources": ["test36#31"]}, {"type": "document", "q": "Question 35 : Selon l'intervenant, quel est le rôle de la littérature ?", "c": ["Aider à une réflexion sur l'existence.", "Contribuer à l'évasion du quotidien.", "Dévoiler les sentiments d'un auteur.", "Solliciter l'imagination du public."], "a": 0, "k": "C'est un miroir renvoyé en permanence à celui qui lit", "transcript": "En des temps comme les nôtres, quel rôle peut jouer la littérature, justement ? La littérature, c'est au fond une sorte de machine à décrypter le réel. L'outil de travail de la littérature, c'est l'émotion que vous créez chez le lecteur. C'est-à-dire que c'est parce que le lecteur va ressentir une émotion, positive ou négative, ça va de l'attachement à la détestation, c'est grâce à ça qu'il va comprendre des choses, ce qui se passe dans le roman, ce qui se passe dans les personnages, et d'une certaine manière, ça va refléter ce qui se passe dans sa vie. C'est un miroir renvoyé en permanence à celui qui lit.", "audio": "CO 37/035.MP3", "_test": "37", "_pos": 35, "_origlabel": "test37#35", "_sources": ["test37#35"]}, {"c": ["Accroître la mixité sociale dans les grandes villes.", "Décrocher des financements pour ses activités.", "Modifier le fonctionnement des marchés aux puces.", "Obtenir un statut professionnel officiel pour les biffins."], "a": 3, "q": "Que souhaite l'association dont il est question ?", "transcript": "Beaucoup de projecteurs maintenant sur la biffe. C'est un phénomène qui s'étend ici, surtout à Paris, fait par la Fricarité. Des hommes et des femmes qui ne sont pas brocanteurs font de la récup, leur métier, revendent en fait tout ce qui peut l'être. Alors le dialogue avec les autochtones n'est pas toujours simple, mais une association se mobilise pour leur permettre de poursuivre leur activité. Les acteurs du marché aux puces expliquent que ce dynamisme économique est nécessaire en ville pour lutter contre la pauvreté, pour réduire les déchets, pour créer une économie circulaire populaire et pour évidemment protéger aussi les ressources de la planète. En premier lieu, pour les familles des biffins et les biffins, c'est nécessaire d'avoir un peu d'argent en vendant sa récup, c'est un travail et il devrait être reconnu comme tel.", "k": "c'est un travail et il devrait être reconnu comme tel", "type": "document", "audio": "CO 39/030.MP3", "_test": "39", "_pos": 30, "_origlabel": "test39#30", "_sources": ["test39#30"]}, {"type": "document", "q": "Question 30. De quoi fait le médecin ?", "c": ["Conseiller des médicaments.", "Établir un certificat médical.", "Examiner une radiographie.", "Traiter un problème de poids."], "a": 1, "k": "j'ai besoin de votre autorisation pour m'inscrire dans un club de sport", "transcript": "Bonjour docteur. Je voudrais faire de l'escalade et j'ai besoin de votre autorisation pour m'inscrire dans un club de sport. L'escalade, mais c'est très mauvais pour votre dos. Je vous conseille plutôt de faire de la natation. La natation, ce n'est pas bon pour ma peau. Et puis j'adore la montagne. Eh bien, faites plutôt de la randonnée. Ah oui, donné c'est une idée, c'est de l'aider à maigrir.", "audio": "CO 11/030.MP3", "_test": "11", "_pos": 30, "_origlabel": "test11#30", "_sources": ["test11#30"]}, {"type": "document", "q": "Quel est le public particulièrement visé par cette publicité ?", "c": ["Les jeunes chefs d'entreprises.", "Les responsables de petites entreprises.", "Les directeurs d'entreprises publiques.", "Les sociétés des secteurs tertiaires."], "a": 1, "k": "dans mon entreprise, moi, je suis tout seul à m'occuper de tout", "transcript": "« C'est vrai que de temps en temps, on entend parler de nouvelles mesures pour l'emploi des jeunes. C'est bien, mais dans mon entreprise, moi, je suis tout seul à m'occuper de tout. Et franchement, je n'ai pas le temps de remplir toute cette paperasse. »\n« Oui, mais il y a du nouveau avec le contrat jeune en entreprise. Si on emploie un jeune peu ou pas diplômé de 16 à 22 ans, c'est zéro charge pour l'entreprise pendant deux ans et 50 % la troisième année, avec une simple déclaration à remplir auprès de l'État. Plus de souci pour les petits patrons, c'est pas mal, non ? »", "audio": "CO 14/032.MP3", "_test": "14", "_pos": 32, "_origlabel": "test14#32", "_sources": ["test14#32"]}, {"type": "document", "q": "De quoi il est question dans cette interview ?", "c": ["Les capacités cognitives des abeilles.", "La communication des abeilles.", "Les dangers qui menacent les abeilles.", "Les méthodes de récolte de miel."], "a": 1, "k": "les abeilles communiquent et qu'elles ont la capacité de communiquer", "transcript": "Et c'est vrai que de découvrir à quel point le cerveau des abeilles, les abeilles ont des capacités cognitives peut être, c'est l'émerveillement devant leur capacité devant ce tout petit cerveau. Et cette méga cognition peut peut-être nous aider à les protéger. Vous dites vous-même que les abeilles communiquent et qu'elles ont la capacité de communiquer. Alors j'aimerais bien qu'on justement qu'on comprenne un peu à quel point elle communique et comment elle communique. On s'arrête, peut-être sur cette fameuse danse des abeilles qui avait été décodée par les tolo Karl von Frisch. Et c'est cette danse qui leur permet de communiquer. C'est ça. Absolument. Donc ça, ça a été l'objet du prix Nobel octroyé à Karl von Frisch. Dans les années 70, il a pu découvrir après de nombreuses années d'études, que les abeilles qui reviennent d'une source de nourriture, donc une fleur qui est riche en hectares, par exemple, font à l'intérieur de la ruche une danse, c'est-à-dire des mouvements stéréotypés qui ont pour capacité d'indiquer la distance et la direction de cette source à d'autres congénères qui ne sont pas ou qui ne connaissent pas, qui ne sont pas allés à cette source de nourriture.", "audio": "CO 15/034.MP3", "_test": "15", "_pos": 34, "_origlabel": "test15#34", "_sources": ["test15#34"]}, {"type": "document", "q": "Question 33. Que doit faire cette personne pour vendre ses légumes ?", "c": ["Donner des conseils de préparation", "Éviter de faire attendre les acheteurs", "Faire connaitre des aliments oubliés", "Respecter le goût des consommateurs"], "a": 0, "k": "Donner des conseils de préparation", "transcript": "Et certains légumes qui sont moins bien connus que d'autres. Oui, la courge, entre autres, c'est quelque chose qui… Vraiment, les gens la regardent avec un point d'interrogation. Qu'est-ce que je vais faire avec ça ? Donc, il faut être imaginatif comme producteur pour tenter les gens de le cuisiner. Puis on comprend que le temps est tellement précieux. Les gens n'ont pas le temps. Donc, il faut essayer de leur trouver des trucs…", "audio": "CO 18/033.MP3", "_test": "18", "_pos": 33, "_origlabel": "test18#33", "_sources": ["test18#33"]}, {"type": "document", "q": "Question 34. Que pense-t-on de l'obligation d'éteindre les portables ?", "c": ["Elle doit servir d'exemple aux enfants.", "Elle est automatique en cas de réunion.", "Elle répond à un besoin des employés.", "Elle s'applique très rarement au travail."], "a": 3, "k": "très peu de patrons demandent à leurs employés d'éteindre leurs portables", "transcript": "Interdire les téléphones de tous les lieux de travail permettrait d'être plus productifs et peut-être même de devenir plus joyeux. À ce jour, très peu de patrons demandent à leurs employés d'éteindre leurs portables quand ils entrent en salle de réunion. Pourtant, ce ne serait pas difficile à mettre en place si nos enfants sont capables de le faire quand ils vont à l'école. Cela devrait être identique pour la majorité des adultes.", "audio": "CO 22/034.MP3", "_test": "22", "_pos": 34, "_origlabel": "test22#34", "_sources": ["test22#34"]}, {"type": "document", "q": "Question 31 : De quoi parle ce témoignage ?", "c": ["D'une compétition sportive", "D'une croisière maritime", "D'une histoire familiale", "D'une rencontre amoureuse"], "a": 2, "k": "essayer de trouver une trace de nos ancêtres", "transcript": "On fait un petit tour de France, c'est-à-dire qu'on est parti vers le sud et on s'est arrêté à La Rochelle parce que nos ancêtres viennent de La Rochelle. Ils sont partis au XVIIe siècle pour le Québec du port de La Rochelle. Donc, on est venu voir le port et essayer de trouver une trace de nos ancêtres.", "audio": "CO 26/031.MP3", "_test": "26", "_pos": 31, "_origlabel": "test26#31", "_sources": ["test26#31"]}, {"type": "document", "q": "Question 35. D'après cet entretien, que souhaite l'ensemble des intéressés ?", "c": ["De nouveaux modes de cultures", "Des circuits de distribution courts", "Des contrôles sanitaires plus rapides", "Des systèmes de production innovants"], "a": 1, "k": "réduire la distance entre la production elle-même et l'assiette", "transcript": "Le souhait de tout le monde aujourd'hui, des producteurs comme des consommateurs, c'est de réduire la distance entre la production elle-même et l'assiette. Mais c'est exactement ça, et donc nous avons vu surgir toutes les pratiques que l'on connaît, les modes de distribution relativement rapides. Et donc le premier forum a voulu être un lieu de rencontre des professionnels pour apprécier les évolutions et les modes de commercialisation et d'achat de nos concitoyens.", "audio": "CO 28/035.MP3", "_test": "28", "_pos": 35, "_origlabel": "test28#35", "_sources": ["test28#35"]}]}</script>

<script>
var ALL = JSON.parse(document.getElementById("qdata").textContent);
var LEVEL_LABEL = {"image": "Images 1–4", "extrait": "5–10", "doc_1_19": "11–19", "doc_20_29": "20–29", "doc_30_35": "30–35", "doc_36_39": "36–39"};
var LEVEL_DESC = {"image": "Question avec image, choix non affichés avant réponse", "extrait": "Extrait sonore, choix non affichés avant réponse", "doc_1_19": "Document sonore, choix toujours affichés", "doc_20_29": "Document sonore, choix toujours affichés", "doc_30_35": "Document sonore, choix toujours affichés", "doc_36_39": "Document sonore, choix toujours affichés"};
var CUR_LEVEL = null;
    try{if(typeof LEVEL_ORDER!=="undefined"&&LEVEL_ORDER&&LEVEL_ORDER.filter){LEVEL_ORDER=LEVEL_ORDER.filter(function(k){return ALL.hasOwnProperty(k);});}}catch(e){}
    try{if(typeof LEVEL_DESC==="object"&&LEVEL_DESC){Object.keys(LEVEL_DESC).forEach(function(k){if(!ALL.hasOwnProperty(k)){delete LEVEL_DESC[k];}});}}catch(e){}
    try{if(typeof LEVEL_LABEL==="object"&&LEVEL_LABEL){Object.keys(LEVEL_LABEL).forEach(function(k){if(!ALL.hasOwnProperty(k)){delete LEVEL_LABEL[k];}});}}catch(e){}
var QQ = [];
var ans = {};
var cur = 0;
var audioObjs = {};

function esc(s) {
  var t = String(s);
  return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function hlText(text, key) {
  var h = esc(text).replace(/\n/g,"<br>");
  if (!key) return h;
  try {
    var ek = esc(key);
    var idx = h.toLowerCase().indexOf(ek.toLowerCase());
    if (idx >= 0) {
      h = h.substring(0,idx) + "<mark>" + h.substring(idx, idx+ek.length) + "</mark>" + h.substring(idx+ek.length);
    }
  } catch(e) {}
  return h;
}

function getTypeLabel(type) {
  if (type==="image")   return "🖼️ Image + 4 propositions";
  if (type==="extrait") return "🎙️ Extrait sonore";
  return "📻 Document sonore";
}

function showLevelSelect() {
  pauseAllAudio();
  CUR_LEVEL = null;
  document.getElementById("hdr-title").textContent = "Compréhension orale – Banque d'entraînement";
  document.getElementById("hdr-sub").textContent = "Choisissez une catégorie pour commencer";
  document.getElementById("progbar-wrap").style.display = "none";
  document.getElementById("proglabels-wrap").style.display = "none";
  var html = "<div class='level-select'>";
  for (var lv in LEVEL_DESC) {
    var n = ALL[lv] ? ALL[lv].length : 0;
    html += "<button class='level-card' onclick='startLevel(\""+lv+"\")'>" +
      "<div class='level-name'>"+LEVEL_LABEL[lv]+"</div>" +
      "<div class='level-desc'>"+LEVEL_DESC[lv]+"</div>" +
      "<div class='level-count'>"+n+" questions</div>" +
    "</button>";
  }
  html += "</div>";
  document.getElementById("view").innerHTML = html;
}

function startLevel(lv) {
  CUR_LEVEL = lv;
  QQ = ALL[lv];
  ans = {};
  audioObjs = {};
  document.getElementById("hdr-title").textContent = "Compréhension orale – " + LEVEL_LABEL[lv];
  document.getElementById("progbar-wrap").style.display = "";
  document.getElementById("proglabels-wrap").style.display = "flex";
  render(0);
}

function updateHeader() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  document.getElementById("hdr-sub").textContent = QQ.length + " questions · " + ok + " correcte(s)";
  var pct = Math.round((Object.keys(ans).length / QQ.length) * 100);
  document.getElementById("prog").style.width = pct + "%";
  document.getElementById("pleft").textContent = "Question " + (cur+1) + " / " + QQ.length;
  document.getElementById("pright").textContent = pct + "% complété";
}

function formatTimeJS(s) {
  if (!s || !isFinite(s) || s < 0) return "0:00";
  var m = Math.floor(s/60);
  var sec = Math.floor(s%60);
  return m + ":" + (sec<10?"0":"") + sec;
}

function pauseAllAudio() {
  for (var k in audioObjs) {
    var a = audioObjs[k];
    if (a && !a.paused) {
      a.pause();
      var icon = document.getElementById("play-icon-"+k);
      if (icon) icon.textContent = "▶";
    }
  }
}

function getOrCreateAudio(qi) {
  if (audioObjs[qi]) return audioObjs[qi];
  var q = QQ[qi];
  var a = new Audio(q.audio);
  audioObjs[qi] = a;
  a.addEventListener("loadedmetadata", function(){
    var seekEl = document.getElementById("seek-"+qi);
    var durEl = document.getElementById("time-dur-"+qi);
    if (seekEl) seekEl.max = a.duration;
    if (durEl) durEl.textContent = formatTimeJS(a.duration);
  });
  a.addEventListener("timeupdate", function(){
    var curEl = document.getElementById("time-cur-"+qi);
    var seekEl = document.getElementById("seek-"+qi);
    if (curEl) curEl.textContent = formatTimeJS(a.currentTime);
    if (seekEl) seekEl.value = a.currentTime;
  });
  a.addEventListener("ended", function(){
    var icon = document.getElementById("play-icon-"+qi);
    if (icon) icon.textContent = "▶";
  });
  return a;
}

function playAudio(qi) {
  var a = getOrCreateAudio(qi);
  var icon = document.getElementById("play-icon-"+qi);
  if (!a.paused) {
    a.pause();
    if (icon) icon.textContent = "▶";
    return;
  }
  pauseAllAudio();
  a.play().catch(function(){});
  icon = document.getElementById("play-icon-"+qi);
  if (icon) icon.textContent = "⏸";
}

function seekAudio(qi, val) {
  var a = getOrCreateAudio(qi);
  a.currentTime = parseFloat(val);
}

function render(i) {
  pauseAllAudio();
  cur = i;
  var q = QQ[i];
  var ua = ans[i];
  var done = ua !== undefined;
  var labels = ["A","B","C","D"];
  var isImage = q.type === "image";

  var imgHtml = "";
  if (isImage && q.imgData) {
    imgHtml = "<div class='img-wrap'><img src='" + q.imgData + "' alt='Q"+(i+1)+"'></div>";
  }

  var existingAudio = audioObjs[i];
  var curT = existingAudio ? existingAudio.currentTime : 0;
  var durT = (existingAudio && isFinite(existingAudio.duration)) ? existingAudio.duration : 0;
  var isPlaying = existingAudio && !existingAudio.paused;
  var audioHtml =
    "<div class='audio-row' style='flex-direction:column;align-items:stretch;gap:8px'>" +
      "<div style='display:flex;align-items:center;gap:10px'>" +
        "<button class='play-btn' onclick='playAudio("+i+")'>"+
          "<span id='play-icon-"+i+"'>"+(isPlaying?"⏸":"▶")+"</span>"+
        "</button>" +
        "<span class='audio-label'>Écouter le document</span>" +
      "</div>" +
      "<div style='display:flex;align-items:center;gap:8px'>" +
        "<span style='font-size:11px;color:#185FA5;min-width:30px;text-align:right' id='time-cur-"+i+"'>"+formatTimeJS(curT)+"</span>" +
        "<input type='range' min='0' max='"+(durT||100)+"' step='0.1' value='"+curT+"' id='seek-"+i+"' oninput='seekAudio("+i+",this.value)' style='flex:1;height:4px;accent-color:#185FA5'>" +
        "<span style='font-size:11px;color:#888;min-width:30px' id='time-dur-"+i+"'>"+formatTimeJS(durT)+"</span>" +
      "</div>" +
    "</div>";

  var choicesHtml = "";
  for (var ci=0; ci<q.c.length; ci++) {
    var cls = "choice";
    if (done) {
      cls += " disabled";
      if (ci === q.a) cls += " correct";
      else if (ua.choice === ci) cls += " wrong";
    }
    var txt;
    if (q.type === "document") {
      txt = "<span>" + esc(q.c[ci]) + "</span>";
    } else {
      txt = done ? "<span>" + esc(q.c[ci]) + "</span>" : "";
    }
    choicesHtml += "<button class='"+cls+"' onclick='pick("+i+","+ci+")'><span class='badge'>"+labels[ci]+"</span>"+txt+"</button>";
  }

  var feedbackHtml = "";
  if (done) {
    feedbackHtml = ua.ok
      ? "<div class='feedback ok'>✅ Bonne réponse !</div>"
      : "<div class='feedback ko'>❌ Réponse incorrecte. La bonne réponse est <strong>"+labels[q.a]+". "+esc(q.c[q.a])+"</strong></div>";
  }

  var transcriptHtml = "";
  if (done && q.transcript) {
    var tContent = hlText(q.transcript.replace(/^— /gm,""), q.k);
    var questionLine = (q.type === "document" && q.q) ? ("<div style='margin-top:.7rem;font-weight:500;font-style:normal'>" + esc(q.q) + "</div>") : "";
    transcriptHtml =
      "<div class='transcript-box' style='margin-top:.85rem'>" +
        tContent + questionLine +
      "</div>";
    if (q.k) {
      transcriptHtml += "<div class='key-label' style='margin-top:.6rem'>🔑 Phrase-clé surlignée</div>";
    }
  }

  var prevDis = i===0 ? " disabled" : "";
  var nextDis = i===QQ.length-1 ? " disabled" : "";
  var srcLabel = (q._sources && q._sources.length) ? "<span class='src-label'>Présent dans : "+q._sources.join(" · ")+"</span>" : (q._origlabel ? "<span class='src-label'>Source : "+q._origlabel+"</span>" : "");

  document.getElementById("view").innerHTML =
    "<div class='nav'>" +
      "" +
      "<button class='btn'"+prevDis+" onclick='render("+(i-1)+")'>← Précédente</button>" +
      "<button class='btn'"+nextDis+" onclick='render("+(i+1)+")'>Suivante →</button>" +
      "<button class='btn btn-results' onclick='summary()'>Résultats</button>" +
    "</div>" +
    "<div class='card'>" +
      "<div class='q-type-label'>"+getTypeLabel(q.type)+"</div>" + srcLabel +
      imgHtml + audioHtml +
      "<div class='question'>Q"+(i+1)+". " + (
        q.type === "document"
          ? "Écoutez le document sonore et la question, choisissez la bonne réponse."
          : q.type === "extrait"
          ? "Écoutez l'extrait sonore et les 4 propositions. Choisissez la bonne réponse."
          : "Écoutez les 4 propositions, choisissez celle qui correspond à l'image."
      ) + "</div>" +
      "<div class='choices'>"+choicesHtml+"</div>" +
      feedbackHtml + transcriptHtml +
    "</div>";

  updateHeader();
}

function pick(qi, ci) {
  if (ans[qi] !== undefined) return;
  ans[qi] = { choice: ci, ok: ci === QQ[qi].a };
  render(qi);
}

function calcScore() {
  var ok=0;
  for (var k in ans) { if (ans[k].ok) ok++; }
  return { ok:ok, total: QQ.length, pct: Math.round(ok/QQ.length*100) };
}

function summary() {
  pauseAllAudio();
  var r = calcScore();
  var gridHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var cls = "grid-btn na";
    var ua = ans[i];
    if (ua) cls = ua.ok ? "grid-btn ok" : "grid-btn ko";
    gridHtml += "<button class='"+cls+"' onclick='render("+i+")' title='Q"+(i+1)+"'>"+(i+1)+"</button>";
  }
  document.getElementById("view").innerHTML =
    "<div class='summary'>" +
      "<h2>📊 Résultats – "+LEVEL_LABEL[CUR_LEVEL]+"</h2>" +
      "<div class='score-block'>" +
        "<div class='score-correct'>"+r.ok+" / "+r.total+" ✓ ("+r.pct+"%)</div>" +
      "</div>" +
      "<div class='grid'>"+gridHtml+"</div>" +
      "<div class='sum-actions'>" +
        "<button class='sum-btn' onclick='showReport()'>📋 Erreurs fréquentes</button>" +
        "<button class='sum-btn pdf' onclick='printPDF()'>🖨️ Exporter PDF</button>" +
        "<button class='sum-btn red' onclick='reset()'>↺ Recommencer cette catégorie</button>" +
        "" +
      "</div>" +
      "<div class='sum-note'>* Banque de pratique regroupée par catégorie (type de question / position), pas un test officiel complet · Score = pourcentage de bonnes réponses</div>" +
    "</div>";
  updateHeader();
}

function showReport() {
  pauseAllAudio();
  var labels = ["A","B","C","D"];
  var wrongItems = [];
  var html = "";
  for (var i=0; i<QQ.length; i++) {
    var ua = ans[i];
    if (!ua || ua.ok) continue;
    wrongItems.push(i);
    var q = QQ[i];
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
      else if (ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = q.transcript ? hlText(q.transcript, q.k) : "";
    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    html +=
      "<div class='report-item'>" +
        "<div class='qnum'>Question "+(i+1)+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.6rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.6rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }
  if (!html) html = "<div style='text-align:center;padding:2rem;color:#185FA5;font-weight:600'>🎉 Aucune erreur ! Bravo !</div>";
  document.getElementById("view").innerHTML =
    "<div class='report-header no-print'>" +
      "<strong style='font-size:16px'>📋 Rapport des erreurs ("+wrongItems.length+" question"+(wrongItems.length!==1?"s":"")+")</strong>" +
      "<button class='btn btn-results' onclick='summary()'>← Retour aux résultats</button>" +
    "</div>" +
    html;
}

function printPDF() {
  var r = calcScore();
  var labels = ["A","B","C","D"];
  var allQHtml = "";
  for (var i=0; i<QQ.length; i++) {
    var q = QQ[i];
    var ua = ans[i];
    var done = ua !== undefined;
    var choicesHtml = "";
    for (var ci=0; ci<q.c.length; ci++) {
      var cls = "report-choice neutral";
      var icon = "";
      if (done) {
        if (ci===q.a) { cls="report-choice correct"; icon="✓ "; }
        else if (ua && ua.choice===ci) { cls="report-choice wrong"; icon="✗ "; }
      }
      choicesHtml += "<div class='"+cls+"'><strong>"+labels[ci]+".</strong> "+icon+esc(q.c[ci])+"</div>";
    }
    var tContent = q.transcript ? hlText(q.transcript, q.k) : "";
    var keyLabel = q.k ? "<div class='key-label' style='margin-bottom:.4rem'>🔑 Phrase-clé surlignée</div>" : "";
    var statusBadge = done ? (ua.ok ? " ✅" : " ❌ (→"+labels[q.a]+")") : " —";
    allQHtml +=
      "<div class='report-item'>" +
        "<div class='qnum'>Q"+(i+1)+statusBadge+" · "+getTypeLabel(q.type)+"</div>" +
        "<div class='question' style='font-size:14px;margin-bottom:.5rem'>"+esc(q.q)+"</div>" +
        choicesHtml +
        (tContent ? "<div class='transcript-box' style='margin-top:.5rem'>"+keyLabel+tContent+"</div>" : "") +
      "</div>";
  }

  var pw = window.open("","_blank");
  pw.document.write(`
